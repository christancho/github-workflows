# Reusable release-candidate workflow: a `vX.Y.Z-rc.N` tag on main becomes a
# tested multi-arch image on GHCR plus a GitHub prerelease.
#
#   validate  tag format, tag commit is on main, vX.Y.Z not released yet
#   build     each image x platform on a NATIVE runner, pushed by digest
#   merge     one multi-arch tag per image (vX.Y.Z-rc.N) + build provenance attestation
#   smoke     the app's smoke test against the PUBLISHED images, on every platform
#   scan      Trivy (fails on fixable vulnerabilities at the given severities)
#   release   GitHub prerelease with images.json (refs + digests + commit) as asset
#
# The prerelease is created only when everything above passed, and
# docker-promote.yml only promotes prereleases, so a failed RC can't be promoted.
#
# Caller (.github/workflows/release-candidate.yml):
#   on: { push: { tags: ["v*-rc.*"] } }
#   permissions: { contents: write, packages: write, id-token: write, attestations: write }
#   jobs:
#     candidate:
#       uses: christancho/github-workflows/.github/workflows/docker-candidate.yml@v1.1.0
#       with:
#         images: '[{"name":"api","context":".","dockerfile":"api/Dockerfile"}]'
#
# Images: ghcr.io/<owner>/<repo>/<name>. GHCR visibility follows the repo for
# packages created by this workflow (set it once in package settings if not).
name: docker-candidate

on:
  workflow_call:
    inputs:
      images:
        description: JSON list of images (name, context, dockerfile relative to context).
        type: string
        required: true
      platforms:
        description: JSON list of {platform, runner}. Each platform builds and is smoke-tested on its own native runner.
        type: string
        default: >-
          [{"platform":"linux/amd64","runner":"ubuntu-24.04"},
           {"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]
      smoke-script:
        type: string
        default: scripts/smoke-test.sh
      scan-severity:
        description: Trivy severities that fail the RC (only vulnerabilities with a fix count).
        type: string
        default: CRITICAL
      runner:
        description: Runner for the platform-independent jobs.
        type: string
        default: ubuntu-latest

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      prefix: ${{ steps.v.outputs.prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          [ "$REF_TYPE" = tag ] || fail "run this from a tag push (got $REF_TYPE)"
          [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-rc\.([0-9]+)$ ]] || fail "$TAG is not vX.Y.Z-rc.N"
          stable="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          git merge-base --is-ancestor "$SHA" origin/main || fail "$TAG points at $SHA, which is not on main"
          if git rev-parse -q --verify "refs/tags/$stable" >/dev/null; then fail "$stable is already released"; fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"
          echo "$TAG at $SHA (on main), stable $stable not released yet"

  build:
    needs: validate
    runs-on: ${{ matrix.p.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: ${{ fromJSON(inputs.images) }}
        p: ${{ fromJSON(inputs.platforms) }}
    env:
      IMAGE: ${{ needs.validate.outputs.prefix }}/${{ matrix.image.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: arch
        env:
          PLATFORM: ${{ matrix.p.platform }}
        run: echo "slug=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context || '.' }}
          file: ${{ matrix.image.context || '.' }}/${{ matrix.image.dockerfile || 'Dockerfile' }}
          platforms: ${{ matrix.p.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ steps.arch.outputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ steps.arch.outputs.slug }}

      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image.name }}-${{ steps.arch.outputs.slug }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: [validate, build]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    env:
      IMAGE: ${{ needs.validate.outputs.prefix }}/${{ matrix.image.name }}
      VERSION: ${{ needs.validate.outputs.version }}
      NAME: ${{ matrix.image.name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.image.name }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: push
        working-directory: ${{ runner.temp }}/digests
        run: |
          refs=()
          for d in *; do refs+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create -t "$IMAGE:$VERSION" "${refs[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/out"
          jq -n --arg name "$NAME" --arg ref "$IMAGE" --arg digest "$digest" \
            '{name: $name, image: $ref, digest: $digest}' > "$RUNNER_TEMP/out/$NAME.json"
          echo "$IMAGE:$VERSION = $digest"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image.name }}
          path: ${{ runner.temp }}/out/${{ matrix.image.name }}.json
          retention-days: 7
          if-no-files-found: error

  smoke:
    needs: merge
    runs-on: ${{ matrix.p.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        p: ${{ fromJSON(inputs.platforms) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull published images by digest
        env:
          PLATFORM: ${{ matrix.p.platform }}
        run: |
          for f in "$RUNNER_TEMP"/images/*.json; do
            name=$(jq -r .name "$f"); ref="$(jq -r .image "$f")@$(jq -r .digest "$f")"
            docker pull --platform "$PLATFORM" "$ref"
            got=$(docker image inspect "$ref" --format '{{.Os}}/{{.Architecture}}')
            [ "$got" = "$PLATFORM" ] || { echo "::error::$name is $got, expected $PLATFORM"; exit 1; }
            echo "IMAGE_$(tr 'a-z-' 'A-Z_' <<<"$name")=$ref" >> "$GITHUB_ENV"
            echo "$name: $ref ($got)"
          done

      - name: Smoke test (${{ matrix.p.platform }})
        env:
          SCRIPT: ${{ inputs.smoke-script }}
        run: |
          [ -f "$SCRIPT" ] || { echo "::error::$SCRIPT not found: an RC needs a smoke test"; exit 1; }
          bash "$SCRIPT"

  scan:
    needs: merge
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - name: Trivy
        env:
          SEVERITY: ${{ inputs.scan-severity }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        run: |
          trivy=(docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD -v trivy-cache:/root/.cache
                 aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb)
          dbs=(--db-repository "public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db")
          status=0
          for f in "$RUNNER_TEMP"/images/*.json; do
            ref="$(jq -r .image "$f")@$(jq -r .digest "$f")"
            echo "::group::$(jq -r .name "$f"): HIGH/CRITICAL (report only)"
            "${trivy[@]}" image "${dbs[@]}" --platform linux/amd64 --severity HIGH,CRITICAL --no-progress "$ref"
            echo "::endgroup::"
            "${trivy[@]}" image "${dbs[@]}" --platform linux/amd64 --severity "$SEVERITY" --ignore-unfixed \
              --exit-code 1 --no-progress --quiet "$ref" || { echo "::error::$ref has fixable $SEVERITY vulnerabilities"; status=1; }
          done
          exit $status

  release:
    needs: [validate, smoke, scan]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          out="$RUNNER_TEMP/release"; mkdir -p "$out"
          jq -s --arg v "$VERSION" --arg c "$SHA" --arg run "$RUN_URL" \
            '{version: $v, commit: $c, run: $run, images: .}' "$RUNNER_TEMP"/images/*.json > "$out/images.json"
          {
            echo "Release candidate built from \`$SHA\`. Smoke-tested on every platform and scanned."
            echo
            echo "| Image | Digest |"
            echo "|---|---|"
            jq -r --arg v "$VERSION" '.images[] | "| `\(.image):\($v)` | `\(.digest)` |"' "$out/images.json"
            echo
            echo "Promote with the **promote** workflow. Pin deployments by digest; \`images.json\` is the record."
            echo
            echo "[Build run]($RUN_URL)"
          } > "$out/notes.md"
          gh release create "$VERSION" "$out/images.json" -R "$GITHUB_REPOSITORY" \
            --verify-tag --prerelease --title "$VERSION" --notes-file "$out/notes.md"
